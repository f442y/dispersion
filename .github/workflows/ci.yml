name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java 25 Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Java 25 (Azul Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Ensure Maven Wrapper Executable
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Build & Package Reactor (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw install -DskipTests -B -ntp -T 1C

      - name: Build & Package Reactor (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd install -DskipTests -B -ntp -T 1C

      - name: Run Unit Tests (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw test -pl '!examples' -B -ntp -T 1C

      - name: Run Unit Tests (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd test -pl "!examples" -B -ntp -T 1C

      - name: Run Integration Tests (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw test -pl examples -B -ntp -T 1C

      - name: Run Integration Tests (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd test -pl examples -B -ntp -T 1C

      - name: Upload Surefire Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore
